# GitHub Actions Workflow: Profile Stats Auto-Refresh
# Author: Moe Kyaw Aung — Senior Android Developer @ Microsoft
# ═══════════════════════════════════════════════════════════════

name: 📊 Refresh GitHub Stats

on:
  schedule:
    - cron: '0 6 * * *'   # 6am UTC daily
  workflow_dispatch:

jobs:
  refresh-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 📊 Trigger stats cache refresh
        run: |
          echo "Refreshing GitHub stats widgets..."
          # Ping the stats APIs to warm up cache
          curl -s "https://github-readme-stats.vercel.app/api?username=Dev-moe-kyawaung&show_icons=true" > /dev/null
          curl -s "https://github-readme-streak-stats.herokuapp.com?user=Dev-moe-kyawaung" > /dev/null
          echo "Stats refresh complete."

      - name: ✅ Done
        run: echo "Profile stats refreshed at $(date -u)"
